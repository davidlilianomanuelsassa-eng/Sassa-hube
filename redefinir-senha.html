<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceitar convite | Sassa Hube</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body{margin:0;padding:25px;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,sans-serif;color:#183047}
    .painel{background:#fff;padding:30px;border-radius:14px;max-width:440px;width:100%;box-sizing:border-box;box-shadow:0 4px 18px #0002}
    h1{color:#123d68}.subtitulo{color:#536579;line-height:1.55}
    label{display:block;font-weight:600;margin-top:14px}
    input{width:100%;padding:13px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #ccd5df;border-radius:7px}
    input[readonly]{background:#f4f7fa;color:#4b6074}
    button{width:100%;padding:13px;border:0;border-radius:7px;background:#087e8b;color:#fff;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}#mensagem{margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <main class="painel">
    <h1>Aceitar convite da Secretaria</h1>
    <p class="subtitulo">O proprietário autorizou o teu acesso ao SASSA HUBE. Confirma o e-mail e cria a tua palavra-passe para entrar no painel individual da secretária.</p>
    <form id="formulario" hidden>
      <label for="email">E-mail convidado</label>
      <input id="email" type="email" autocomplete="username" readonly required>
      <label for="senha">Nova palavra-passe</label>
      <input id="senha" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirmacao">Confirmar palavra-passe</label>
      <input id="confirmacao" type="password" minlength="12" autocomplete="new-password" required>
      <button id="guardar" type="submit">Guardar e entrar no painel</button>
    </form>
    <p id="mensagem" role="status">A validar o convite...</p>
    <p><a href="index.html">Voltar ao SASSA HUBE</a></p>
  </main>
  <script>
    const mensagem=document.getElementById("mensagem");
    const formulario=document.getElementById("formulario");
    const guardar=document.getElementById("guardar");
    let cliente=null;
    try{
      if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY) throw new Error("Configuração indisponível");
      cliente=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
    }catch(e){
      mensagem.textContent="Não foi possível carregar o serviço de autenticação.";
    }
    async function iniciar(){
      if(!cliente)return;
      const {data:{session},error}=await cliente.auth.getSession();
      if(error||!session){
        mensagem.textContent="O convite não é válido ou já expirou. Pede ao proprietário para enviar um novo link.";
        return;
      }
      const {data:{user},error:userError}=await cliente.auth.getUser();
      if(userError||!user||!user.email){
        mensagem.textContent="Não foi possível confirmar o e-mail do convite. Abre novamente o link recebido.";
        return;
      }
      document.getElementById("email").value=user.email;
      formulario.hidden=false;
      mensagem.textContent="Convite confirmado. Define a tua palavra-passe para concluir o acesso.";
    }
    formulario.addEventListener("submit",async evento=>{
      evento.preventDefault();
      const senha=document.getElementById("senha").value;
      const confirmacao=document.getElementById("confirmacao").value;
      if(senha.length<12){mensagem.textContent="A palavra-passe deve ter pelo menos 12 caracteres.";return;}
      if(senha!==confirmacao){mensagem.textContent="As palavras-passe não coincidem.";return;}
      guardar.disabled=true;
      mensagem.textContent="A guardar a palavra-passe...";
      const {error}=await cliente.auth.updateUser({password:senha});
      if(error){
        guardar.disabled=false;
        mensagem.textContent="Não foi possível guardar a palavra-passe. O link pode ter expirado; pede um novo convite.";
        return;
      }
      mensagem.textContent="Palavra-passe guardada. A abrir o painel individual da secretária...";
      const destino=new URLSearchParams(window.location.search).get("next");
      if(destino==="secretaria-painel.html"){
        window.location.replace("secretaria-painel.html");
      }else{
        window.location.replace("secretaria-painel.html");
      }
    });
    await iniciar();
  </script>
</body>
</html>
