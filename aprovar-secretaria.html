<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprovação da Secretaria | Sassa Hube</title><link rel="stylesheet" href="style.css">
<style>
body{background:#f3f7f3}.wrap{width:min(1050px,calc(100% - 28px));margin:32px auto 70px}.head,.request{background:#fff;border:1px solid #e0eae1;border-radius:17px;padding:22px;margin-bottom:14px}.head{background:linear-gradient(120deg,#0b3024,#1d6047);color:#fff}.head h1{color:#fff}.muted{color:#66786d}.head .muted{color:#d5e7da}.request{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.request h3{margin:0 0 7px;color:#19583f}.actions{display:flex;gap:8px;flex-wrap:wrap}.state{font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px;background:#f0f3f1}.status{min-height:24px}.empty{padding:24px;text-align:center;color:#66786d;background:#fff;border-radius:14px}
</style></head><body>
<header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">SH</span><span>SASSA HUBE<small>APROVAÇÃO DE ACESSOS</small></span></a><a class="btn btn-outline" href="admin.html">Painel administrativo</a></header>
<main class="wrap">
<section class="head"><span class="eyebrow">CONTROLO DO PROPRIETÁRIO</span><h1>Pedidos de acesso à Secretaria</h1><p class="muted">Analisa cada pedido. Só ao aprovar é que a conta recebe permissões para entrar no painel individual.</p></section>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0"><button id="refresh" class="btn btn-primary" type="button">Actualizar pedidos</button><span id="status" class="status" role="status"></span></div>
<div id="requests"><p class="empty">A carregar pedidos...</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const db=window.supabase?.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const box=document.getElementById("requests"),status=document.getElementById("status");
function say(t,bad=false){status.textContent=t;status.style.color=bad?"#b42318":"#16804a";}
async function load(){
 box.innerHTML='<p class="empty">A carregar pedidos...</p>';
 const {data:{session}}=await db.auth.getSession();
 if(!session){box.innerHTML='<p class="empty">Inicia sessão primeiro no <a href="admin.html">painel administrativo</a> e depois volta a esta página.</p>';return;}
 const {data,error}=await db.functions.invoke("secretary-onboarding",{body:{action:"list"}});
 if(error){box.innerHTML='<p class="empty">Acesso recusado ou não foi possível carregar. Confirma que entraste com a conta do proprietário.</p>';return;}
 box.replaceChildren();
 const rows=data?.requests||[];
 if(!rows.length){box.innerHTML='<p class="empty">Ainda não existem pedidos de acesso.</p>';return;}
 rows.forEach(r=>{
  const card=document.createElement("article");card.className="request";
  const info=document.createElement("div");const title=document.createElement("h3");title.textContent=r.full_name;
  const email=document.createElement("p");email.textContent=r.email;
  const date=document.createElement("small");date.className="muted";date.textContent="Pedido: "+new Date(r.created_at).toLocaleString("pt-AO");
  const state=document.createElement("span");state.className="state";state.textContent=({pending:"Pendente",approved:"Aprovado",rejected:"Rejeitado"}[r.status]||r.status);
  info.append(title,email,date,state);card.append(info);
  if(r.status==="pending"){
   const actions=document.createElement("div");actions.className="actions";
   [["approve","Aprovar","btn btn-primary"],["reject","Rejeitar","btn btn-outline"]].forEach(([decision,label,cls])=>{
    const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;
    b.addEventListener("click",async()=>{
     if(decision==="reject"&&!confirm("Queres rejeitar o pedido de "+r.full_name+"?"))return;
     if(decision==="approve"&&!confirm("Aprovar "+r.full_name+" e activar o acesso individual à Secretaria?"))return;
     b.disabled=true;say("A registar decisão...");
     const {error}=await db.functions.invoke("secretary-onboarding",{body:{action:"review",request_id:r.id,decision}});
     if(error){b.disabled=false;say("Não foi possível concluir a decisão. Verifica a sessão e tenta novamente.",true);return;}
     say(decision==="approve"?"Pedido aprovado. A conta já pode entrar no painel da Secretaria.":"Pedido rejeitado.");
     await load();
    });actions.append(b);
   });card.append(actions);
  }
  box.append(card);
 });
}
document.getElementById("refresh").addEventListener("click",load);
load();
</script></body></html>
